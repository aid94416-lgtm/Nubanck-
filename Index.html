<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nubank Natan</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel para transpilar o JSX diretamente no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-zinc-950 text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // Ícone Genérico reutilizável do Lucide
    const Icon = ({ name, className }) => {
      React.useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    const INITIAL_BALANCE = 5000.00;
    const INITIAL_CREDIT_LIMIT = 10000.00;
    const INITIAL_CREDIT_USED = 1250.00;

    const formatBRL = (val) => {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
    };

    function App() {
      const [userName, setUserName] = useState('Natan');
      const [balance, setBalance] = useState(INITIAL_BALANCE);
      const [creditLimit, setCreditLimit] = useState(INITIAL_CREDIT_LIMIT);
      const [creditUsed, setCreditUsed] = useState(INITIAL_CREDIT_USED);
      const [showBalance, setShowBalance] = useState(true);

      const [activeModal, setActiveModal] = useState(null);
      const [customBalanceInput, setCustomBalanceInput] = useState('');
      const [customLimitInput, setCustomLimitInput] = useState('');
      const [customInvoiceInput, setCustomInvoiceInput] = useState('');
      const [customUserNameInput, setCustomUserNameInput] = useState('Natan');

      const openBalanceEditModal = () => {
        setCustomBalanceInput(balance.toString());
        setCustomLimitInput(creditLimit.toString());
        setCustomInvoiceInput(creditUsed.toString());
        setCustomUserNameInput(userName);
        setActiveModal('edit_money');
      };

      const handleSaveCustomMoney = () => {
        if (customUserNameInput.trim()) setUserName(customUserNameInput.trim());
        if (customBalanceInput !== '') setBalance(parseFloat(customBalanceInput) || 0);
        if (customLimitInput !== '') setCreditLimit(parseFloat(customLimitInput) || 0);
        if (customInvoiceInput !== '') setCreditUsed(parseFloat(customInvoiceInput) || 0);
        setActiveModal(null);
      };

      return (
        <div className="flex justify-center items-center min-h-screen bg-zinc-950 text-white p-0 sm:p-4 font-sans">
          <div className="w-full max-w-md bg-[#0D001A] min-h-screen sm:min-h-[800px] sm:rounded-[36px] shadow-2xl flex flex-col justify-between relative overflow-hidden border-zinc-800 border sm:border-8">
            
            {/* Header */}
            <header className="bg-[#820AD1] text-white p-5 pt-6 rounded-b-3xl shadow-lg">
              <div className="flex justify-between items-center mb-5">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-bold">
                    <Icon name="user" className="w-5 h-5" />
                  </div>
                  <div>
                    <span className="text-[10px] text-purple-200 block">Olá,</span>
                    <h1 className="text-sm font-bold">{userName}</h1>
                  </div>
                </div>

                <button 
                  onClick={() => setShowBalance(!showBalance)}
                  className="p-2 bg-white/10 rounded-full"
                >
                  <Icon name={showBalance ? "eye" : "eye-off"} className="w-4 h-4" />
                </button>
              </div>

              <div className="space-y-1">
                <span className="text-purple-200 text-[11px] font-semibold uppercase">Conta</span>
                <div 
                  onClick={openBalanceEditModal}
                  className="flex items-center space-x-2 cursor-pointer hover:bg-white/10 p-1.5 rounded-xl transition-all"
                >
                  <span className="text-2xl font-black">
                    {showBalance ? formatBRL(balance) : '•••••'}
                  </span>
                  <Icon name="edit-2" className="w-4 h-4 text-purple-200" />
                </div>
              </div>
            </header>

            {/* Main Body */}
            <main className="flex-1 p-4 space-y-4">
              <div className="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl space-y-3">
                <div className="flex justify-between items-center">
                  <span className="font-bold text-xs">Cartão de crédito</span>
                  <Icon name="credit-card" className="w-4 h-4 text-[#820AD1]" />
                </div>

                <div>
                  <span className="text-[11px] text-zinc-400 block">Fatura atual</span>
                  <div 
                    onClick={openBalanceEditModal}
                    className="text-xl font-black cursor-pointer hover:text-[#820AD1] transition-colors"
                  >
                    {showBalance ? formatBRL(creditUsed) : '•••••'}
                  </div>
                </div>

                <div className="flex justify-between text-[10px] text-zinc-400 pt-2 border-t border-zinc-800">
                  <span>Limite disponível</span>
                  <span onClick={openBalanceEditModal} className="font-bold text-zinc-200 cursor-pointer">
                    {showBalance ? formatBRL(creditLimit - creditUsed) : '•••••'}
                  </span>
                </div>
              </div>
            </main>

            {/* Modal Editar Valores */}
            {activeModal === 'edit_money' && (
              <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                <div className="bg-zinc-900 w-full max-w-sm rounded-3xl p-5 space-y-4 border border-purple-500/30">
                  <h3 className="font-bold text-base text-purple-300">Alterar Valores</h3>
                  
                  <div className="space-y-2">
                    <label className="text-xs text-zinc-300">Seu Nome</label>
                    <input 
                      type="text" 
                      value={customUserNameInput}
                      onChange={(e) => setCustomUserNameInput(e.target.value)}
                      className="w-full p-2.5 bg-zinc-800 rounded-xl text-xs border border-zinc-700 outline-none"
                    />

                    <label className="text-xs text-zinc-300 block">Saldo (R$)</label>
                    <input 
                      type="number" 
                      value={customBalanceInput}
                      onChange={(e) => setCustomBalanceInput(e.target.value)}
                      className="w-full p-2.5 bg-zinc-800 rounded-xl text-xs border border-zinc-700 outline-none text-emerald-400 font-bold"
                    />

                    <label className="text-xs text-zinc-300 block">Limite Total (R$)</label>
                    <input 
                      type="number" 
                      value={customLimitInput}
                      onChange={(e) => setCustomLimitInput(e.target.value)}
                      className="w-full p-2.5 bg-zinc-800 rounded-xl text-xs border border-zinc-700 outline-none"
                    />

                    <label className="text-xs text-zinc-300 block">Fatura Atual (R$)</label>
                    <input 
                      type="number" 
                      value={customInvoiceInput}
                      onChange={(e) => setCustomInvoiceInput(e.target.value)}
                      className="w-full p-2.5 bg-zinc-800 rounded-xl text-xs border border-zinc-700 outline-none text-rose-400"
                    />
                  </div>

                  <div className="flex space-x-2 pt-2">
                    <button 
                      onClick={() => setActiveModal(null)}
                      className="w-1/2 bg-zinc-800 py-2.5 rounded-full text-xs font-bold"
                    >
                      Cancelar
                    </button>
                    <button 
                      onClick={handleSaveCustomMoney}
                      className="w-1/2 bg-[#820AD1] py-2.5 rounded-full text-xs font-bold"
                    >
                      Salvar
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
